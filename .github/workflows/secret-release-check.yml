name: Secret release checks
on:
  pull_request:
    branches: [feat/secret]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: secret-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Test Secret contracts and build API and worker
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :test --tests 'com.logssey.secret.*' :secret-worker:test :bootJar :secret-worker:bootJar --console=plain
      - name: Build immutable-input API and worker images
        run: |
          docker build --target api -t logssey-secret-api:ci .
          docker build --target worker -t logssey-secret-worker:ci .
      - name: Verify isolated images without provider credentials
        run: sh deploy/verify-images.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: secret-test-reports
          path: |
            build/reports/tests/test/
            secret-worker/build/reports/tests/test/
          retention-days: 7
