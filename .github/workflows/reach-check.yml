# Reach checks: backend Reach tests and the L2 analyzer tests on pull requests.
# No credentials: tests use Testcontainers (Docker on the runner) and local sample apps only.
# Actions are pinned to the same commit SHAs as secret-release-check.yml.
name: Reach checks

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'src/main/java/com/logssey/reach/**'
      - 'src/test/java/com/logssey/reach/**'
      - 'src/main/resources/reach/**'
      # Shared migrations and build files can break Reach too
      - 'src/main/resources/db/migration/**'
      - 'src/testFixtures/**'
      - 'reach-analyzer/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - '.github/workflows/reach-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reach-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Reach backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Reach tests (com.logssey.reach.*)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :test --tests 'com.logssey.reach.*' --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: reach-test-reports
          path: build/reports/tests/test/
          retention-days: 7

  analyzer:
    name: Reach analyzer tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # fixtureTest builds the sample apps with javac/jar and checks verdicts with python3 (both on the runner);
      # verdictTest runs the bundle.py unit tests
      - name: Analyzer jar, sample apps, bundle.py
        run: |
          chmod +x gradlew
          python3 --version
          ./gradlew --no-daemon :reach-analyzer:jar :reach-analyzer:fixtureTest :reach-analyzer:verdictTest --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: reach-analyzer-output
          path: reach-analyzer/build/fixtures/
          retention-days: 7
