# Dashboard deploy: every merge to develop goes to https://logssey.re-used.store.
# tests -> API, Secret worker, and Compliance worker images to ECR (tag = commit) -> SSM document
# logssey-dashboard-deploy runs /opt/logssey/deploy.sh on the host, first for the API (it applies migrations),
# then for the independent workers of the same commit.
# deploy.sh dumps the database (API), swaps the digest, checks health and rolls back to the previous image if it fails.
# AWS side: infrastructure terraform/environments/logssey-dashboard/deploy.tf (the role only accepts develop runs of this repo).
# Repository variables: DASHBOARD_DEPLOY_ROLE_ARN, DASHBOARD_INSTANCE_ID (terraform output deploy_role_arns.api, instance_id),
# DASHBOARD_DEPLOY_WORKER and DASHBOARD_DEPLOY_COMPLIANCE_WORKER gate each independent worker deployment.
# Actions are pinned to the same commit SHAs as reach-check.yml and deploy/reach/ci/reach.yml.
name: Dashboard deploy

on:
  push:
    branches: [develop]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-deploy-api
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  API_REPOSITORY: logssey/dashboard-api
  WORKER_REPOSITORY: logssey/dashboard-secret-worker
  COMPLIANCE_WORKER_REPOSITORY: logssey/dashboard-compliance-worker
  DEPLOY_DOCUMENT: logssey-dashboard-deploy

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # The images hold the root project and two independent workers;
      # Testcontainers uses the runner's Docker
      - name: Tests (API, Secret worker, and Compliance worker)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :test :secret-worker:test :compliance-worker:test --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: backend-test-reports
          path: |
            build/reports/tests/test/
            secret-worker/build/reports/tests/test/
            compliance-worker/build/reports/tests/test/
          retention-days: 7

  deploy:
    name: Build and deploy the API and independent workers
    needs: test
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check deploy settings
        env:
          ROLE_ARN: ${{ vars.DASHBOARD_DEPLOY_ROLE_ARN }}
          INSTANCE_ID: ${{ vars.DASHBOARD_INSTANCE_ID }}
        run: |
          if [ -z "$ROLE_ARN" ] || [ -z "$INSTANCE_ID" ]; then
            echo "::error::Set repository variables DASHBOARD_DEPLOY_ROLE_ARN and DASHBOARD_INSTANCE_ID"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.DASHBOARD_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Build and push the images
        id: image
        run: |
          set -euo pipefail
          registry="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_REGION.amazonaws.com"
          tag="${GITHUB_SHA::12}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          # push <output name> <Dockerfile target> <ECR repository>
          push() {
            local image="$registry/$3:$tag" digest
            # Tags are immutable, so a re-run of the same commit reuses the image it already pushed
            if ! aws ecr describe-images --repository-name "$3" --image-ids imageTag="$tag" > /dev/null 2>&1; then
              docker build --target "$2" -t "$image" .
              docker push "$image"
            fi
            digest=$(aws ecr describe-images --repository-name "$3" --image-ids imageTag="$tag" \
              --query 'imageDetails[0].imageDigest' --output text)
            if ! [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::No digest for $image"
              exit 1
            fi
            echo "$1=$digest" >> "$GITHUB_OUTPUT"
            echo "Image: \`$image@$digest\`" >> "$GITHUB_STEP_SUMMARY"
          }
          push api api "$API_REPOSITORY"
          push worker worker "$WORKER_REPOSITORY"
          push compliance_worker compliance-worker "$COMPLIANCE_WORKER_REPOSITORY"
      - name: Deploy the API on the dashboard host
        env:
          INSTANCE_ID: ${{ vars.DASHBOARD_INSTANCE_ID }}
          DIGEST: ${{ steps.image.outputs.api }}
        run: bash .github/scripts/dashboard-deploy-ssm.sh api "$DIGEST"
      # After the API, so the worker starts on the schema the API just migrated
      - name: Deploy the Secret worker on the dashboard host
        if: vars.DASHBOARD_DEPLOY_WORKER == 'true'
        env:
          INSTANCE_ID: ${{ vars.DASHBOARD_INSTANCE_ID }}
          DIGEST: ${{ steps.image.outputs.worker }}
        run: bash .github/scripts/dashboard-deploy-ssm.sh worker "$DIGEST"
      # Independent and resource-bounded. It starts disabled until AWS workload identity is approved.
      - name: Deploy the Compliance worker on the dashboard host
        if: vars.DASHBOARD_DEPLOY_COMPLIANCE_WORKER == 'true'
        env:
          INSTANCE_ID: ${{ vars.DASHBOARD_INSTANCE_ID }}
          DIGEST: ${{ steps.image.outputs.compliance_worker }}
        run: bash .github/scripts/dashboard-deploy-ssm.sh compliance-worker "$DIGEST"
