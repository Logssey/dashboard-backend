spring.application.name=dashboard-backend

# 프로젝트 맨 위의 .env 파일을 읽어서 아래 ${...} 값을 채운다 (.env는 GitHub에 올리지 않음)
# 주의: .env는 properties 방식으로 읽혀서 한글을 그대로 쓰면 깨진다. 영어로 쓴다
spring.config.import=optional:file:.env[.properties]

# DB 연결 (compose.yaml로 띄운 로컬 PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 테이블은 Flyway(db/migration 폴더의 SQL)로만 만든다. JPA는 테이블을 만들지 않고 맞는지 검사만 한다
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# 미리 넣어둘 관리자 계정 (ADR-D003). 값은 .env에서 읽는다
logssey.admin.login-id=${ADMIN_LOGIN_ID}
logssey.admin.password=${ADMIN_PASSWORD}
logssey.admin.display-name=${ADMIN_DISPLAY_NAME}

# Explicit Secret permissions for existing dashboard users. ADMIN alone has no Secret roles.
# Leave blank until the named users are approved; a revoked bootstrap grant is not restored on restart.
logssey.secret.bootstrap-security-login-id=${SECRET_BOOTSTRAP_SECURITY_LOGIN_ID:}
logssey.secret.bootstrap-remediator-login-id=${SECRET_BOOTSTRAP_REMEDIATOR_LOGIN_ID:}
logssey.secret.bootstrap-remediator-team=${SECRET_BOOTSTRAP_REMEDIATOR_TEAM:}
logssey.secret.bootstrap-operations-login-id=${SECRET_BOOTSTRAP_OPERATIONS_LOGIN_ID:}

# Optional AI response guide. GET always serves server-authored guidance without a provider call.
# POST remains opt-in and restricted to trusted synthetic TEST cases with every location readable.
logssey.secret.guide.groq.enabled=${SECRET_GUIDE_GROQ_ENABLED:false}
logssey.secret.guide.groq.api-key=${GROQ_API_KEY:}
# Runtime endpoint/model are allowlisted; arbitrary HTTPS destinations and loopback are rejected.
logssey.secret.guide.groq.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
logssey.secret.guide.groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
# Safe ranges: timeout 250..8000 ms, calls 1..6 per minute per process, success cache 30..900 s.
logssey.secret.guide.groq.timeout-ms=${SECRET_GUIDE_GROQ_TIMEOUT_MS:5000}
logssey.secret.guide.groq.calls-per-minute=${SECRET_GUIDE_GROQ_CALLS_PER_MINUTE:6}
logssey.secret.guide.groq.cache-seconds=${SECRET_GUIDE_GROQ_CACHE_SECONDS:300}

# Notion 페이지 유출 탐지 (읽기 전용 수집기 logssey-secret-collector-dev). 값은 .env에서 읽고, 없으면 스캔하지 않는다
logssey.notion.collector.token=${NOTION_COLLECTOR_TOKEN:}
# 키 지문(HMAC)용 서버 비밀값 (ADR-D009). 바꾸면 기존 지문과 비교할 수 없다
logssey.credential.fingerprint-secret=${CREDENTIAL_FINGERPRINT_SECRET:}

# Runtime collector. Empty means every /internal/v1/runtime request is rejected.
# Local development may set a long random token; production will move to mTLS.
logssey.runtime.collector-token=${RUNTIME_COLLECTOR_TOKEN:}
logssey.runtime.expected-worker-count=${RUNTIME_EXPECTED_WORKER_COUNT:3}
logssey.runtime.sensor-degraded-after=${RUNTIME_SENSOR_DEGRADED_AFTER:PT2M}
logssey.runtime.sensor-offline-after=${RUNTIME_SENSOR_OFFLINE_AFTER:PT5M}
logssey.runtime.max-payload-bytes=${RUNTIME_MAX_PAYLOAD_BYTES:262144}
logssey.runtime.max-events-per-rule-node-minute=${RUNTIME_MAX_EVENTS_PER_RULE_NODE_MINUTE:300}
logssey.runtime.raw-payload-retention=${RUNTIME_RAW_PAYLOAD_RETENTION:P30D}
logssey.runtime.rate-window-retention=${RUNTIME_RATE_WINDOW_RETENTION:P7D}
logssey.runtime.maintenance-batch-size=${RUNTIME_MAINTENANCE_BATCH_SIZE:1000}
logssey.runtime.maintenance-cron=${RUNTIME_MAINTENANCE_CRON:0 15 3 * * *}

# 로그인 세션: 1시간 동안 요청이 없으면 자동 로그아웃, 세션 쿠키는 HttpOnly
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true

# Provider authentication checks require separate runtime opt-in and per-scope approval.
logssey.secret.validation.aws.enabled=${SECRET_AWS_VALIDATION_ENABLED:false}
logssey.secret.validation.github.enabled=${SECRET_GITHUB_VALIDATION_ENABLED:false}
logssey.secret.validation.notion.enabled=${SECRET_NOTION_VALIDATION_ENABLED:false}

# API capability reflects the same source-pipeline opt-ins as worker deployment.
logssey.secret.github.enabled=${SECRET_GITHUB_PIPELINE_ENABLED:false}
logssey.secret.aws.content.enabled=${SECRET_AWS_CONTENT_READ_ENABLED:false}

# PROFILE preserves explicit local profiles. WORKLOAD uses only SDK-managed temporary roles.
logssey.secret.aws.collection.credentials-mode=${SECRET_AWS_CREDENTIALS_MODE:PROFILE}

# Read-only internal operations health. Source observation assists human confirmation only.
logssey.secret.operations.deployment-key=${SECRET_OPERATIONS_DEPLOYMENT_KEY:secret-worker}
logssey.secret.operations.expected-instances=${SECRET_EXPECTED_WORKER_COUNT:1}
logssey.secret.permissions.enabled=${SECRET_PERMISSION_ASSISTANCE_ENABLED:false}
