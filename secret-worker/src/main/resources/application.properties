spring.application.name=secret-worker
spring.main.web-application-type=none
spring.main.keep-alive=true
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SECRET_DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME}}
spring.datasource.username=${SECRET_DB_USERNAME:${DB_USERNAME}}
spring.datasource.password=${SECRET_DB_PASSWORD:${DB_PASSWORD}}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-timeout=10000

# This process only reserves jobs. No collector/consumer exists in this version.
logssey.secret.scheduler.enabled=${SECRET_SCHEDULER_ENABLED:false}
logssey.secret.scheduler.poll-delay=${SECRET_SCHEDULER_POLL_DELAY:30s}
logssey.secret.scheduler.scan-interval=${SECRET_SCAN_INTERVAL:6h}
logssey.secret.scheduler.batch-size=${SECRET_SCHEDULER_BATCH_SIZE:100}
logssey.secret.scheduler.max-attempts=${SECRET_JOB_MAX_ATTEMPTS:3}
