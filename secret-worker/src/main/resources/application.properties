spring.application.name=secret-worker
spring.main.web-application-type=none
spring.main.keep-alive=true
spring.config.import=optional:file:.env[.properties]

# Reservation, external execution and DB-only assessment polls can progress independently.
spring.task.scheduling.pool.size=${SECRET_SCHEDULING_POOL_SIZE:3}

spring.datasource.url=${SECRET_DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME}}
spring.datasource.username=${SECRET_DB_USERNAME:${DB_USERNAME}}
spring.datasource.password=${SECRET_DB_PASSWORD:${DB_PASSWORD}}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-timeout=10000

# Reservation runs separately from execution.
logssey.secret.scheduler.enabled=${SECRET_SCHEDULER_ENABLED:false}
logssey.secret.scheduler.poll-delay=${SECRET_SCHEDULER_POLL_DELAY:30s}
logssey.secret.scheduler.scan-interval=${SECRET_SCAN_INTERVAL:6h}
logssey.secret.scheduler.batch-size=${SECRET_SCHEDULER_BATCH_SIZE:100}
logssey.secret.scheduler.max-attempts=${SECRET_JOB_MAX_ATTEMPTS:3}

# Execution remains opt-in; GitHub processing also requires its own opt-in below.
logssey.secret.executor.enabled=${SECRET_JOB_EXECUTOR_ENABLED:false}
logssey.secret.executor.poll-delay=${SECRET_JOB_POLL_DELAY:30s}
logssey.secret.executor.lease-duration=${SECRET_JOB_LEASE_DURATION:5m}
logssey.secret.executor.batch-size=${SECRET_JOB_BATCH_SIZE:10}
logssey.secret.executor.retry-initial-delay=${SECRET_JOB_RETRY_INITIAL_DELAY:30s}
logssey.secret.executor.retry-max-delay=${SECRET_JOB_RETRY_MAX_DELAY:30m}

# Explicit opt-in. Synthetic fixtures and newly discovered candidates are never validated by default.
logssey.secret.validation.aws.enabled=${SECRET_AWS_VALIDATION_ENABLED:false}
logssey.secret.validation.github.enabled=${SECRET_GITHUB_VALIDATION_ENABLED:false}
logssey.secret.validation.notion.enabled=${SECRET_NOTION_VALIDATION_ENABLED:false}

# This pipeline is opt-in. App key and fingerprint key are read from the worker environment only.
logssey.secret.github.enabled=${SECRET_GITHUB_PIPELINE_ENABLED:false}
logssey.secret.github.app-id=${SECRET_GITHUB_APP_ID:0}
logssey.secret.github.installation-id=${SECRET_GITHUB_INSTALLATION_ID:0}
logssey.secret.github.private-key-path=${SECRET_GITHUB_PRIVATE_KEY_PATH:}

# The database contains notion-internal:default, never a token or a file path.
logssey.secret.notion.collection.enabled=${SECRET_NOTION_COLLECTION_ENABLED:false}
logssey.secret.notion.token-file=${SECRET_NOTION_TOKEN_FILE:}

# Shared by explicitly enabled GitHub, AWS content and Notion pipelines.
logssey.secret.detection.gitleaks-path=${SECRET_GITLEAKS_PATH:}
logssey.secret.detection.fingerprint-key=${SECRET_FINGERPRINT_KEY_BASE64:}
logssey.secret.detection.fingerprint-key-version=${SECRET_FINGERPRINT_KEY_VERSION:}

# AWS IAM metadata inventory requires a separate explicit profile and opt-in.
# Live AWS source credentials and full IAM key IDs never enter logs or result tables.
logssey.secret.aws.collection.enabled=${SECRET_AWS_COLLECTION_ENABLED:false}
logssey.secret.aws.collection.profile=${SECRET_AWS_PROFILE:}
logssey.secret.aws.collection.credentials-mode=${SECRET_AWS_CREDENTIALS_MODE:PROFILE}
logssey.secret.aws.collection.identity-key=${SECRET_AWS_METADATA_HMAC_KEY_BASE64:}
logssey.secret.aws.collection.identity-key-version=${SECRET_AWS_METADATA_HMAC_KEY_VERSION:}

# AWS value reads need this separate opt-in in addition to collection and exact scope approval.
logssey.secret.aws.content.enabled=${SECRET_AWS_CONTENT_READ_ENABLED:false}

# Credential validation must never emit SDK request headers or wire bodies.
logging.level.software.amazon.awssdk=OFF
logging.level.org.apache.hc.client5.http.wire=OFF
logging.level.org.apache.hc.client5.http.headers=OFF

# Independent heartbeat/maintenance; external alert delivery and core-ledger purge are absent.
logssey.secret.operations.enabled=${SECRET_OPERATIONS_ENABLED:true}
logssey.secret.operations.deployment-key=${SECRET_OPERATIONS_DEPLOYMENT_KEY:secret-worker}
logssey.secret.operations.expected-instances=${SECRET_EXPECTED_WORKER_COUNT:1}
logssey.secret.operations.snapshot-cleanup.enabled=${SECRET_SNAPSHOT_CLEANUP_ENABLED:true}
logssey.secret.permissions.enabled=${SECRET_PERMISSION_ASSISTANCE_ENABLED:false}
logssey.secret.permissions.poll-delay=${SECRET_PERMISSION_POLL_DELAY:30s}
