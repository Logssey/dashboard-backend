plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

group = rootProject.group
version = rootProject.version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-json'
    implementation 'software.amazon.awssdk:sts:2.55.12'
    implementation 'software.amazon.awssdk:apache5-client:2.55.12'
    implementation 'org.apache.httpcomponents.client5:httpclient5'
    implementation 'software.amazon.awssdk:iam:2.55.12'
    implementation 'software.amazon.awssdk:cloudtrail:2.55.12'
    implementation 'software.amazon.awssdk:secretsmanager:2.55.12'
    implementation 'software.amazon.awssdk:ssm:2.55.12'
    implementation 'software.amazon.awssdk:s3:2.55.12'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'tools.jackson.core:jackson-databind'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// API and worker use the same migrations; the worker does not import API code/configuration.
tasks.named('processResources') {
    from(rootProject.file('src/main/resources')) {
        include 'db/migration/**'
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// Only the isolated DB/engine core is shared; the worker never imports API configuration.
sourceSets.main.java.srcDir(rootProject.file('src/main/java/com/logssey/secret/risk/core'))
sourceSets.main.java.srcDir(rootProject.file('src/main/java/com/logssey/secret/aws'))
sourceSets.main.java.srcDir(rootProject.file('src/main/java/com/logssey/secret/notion'))
sourceSets.main.java.srcDir(rootProject.file('src/main/java/com/logssey/secret/operations'))
sourceSets.main.java.exclude('**/SecretOperationsService.java','**/SecretOperationsController.java','**/SecretOperationsApiMonitor.java')
sourceSets.main.java.srcDir(rootProject.file('src/main/java/com/logssey/secret/permission/core'))
sourceSets.main.java.srcDir(rootProject.file('src/main/java/com/logssey/secret/usage/core'))
sourceSets.test.java.srcDir(rootProject.file('src/testFixtures/java'))

sourceSets.main.java.srcDir(rootProject.file('src/main/java/com/logssey/secret/run/progress/core'))
