spring.application.name=compliance-worker
spring.main.web-application-type=none
spring.main.keep-alive=true
spring.config.import=optional:file:.env[.properties]

# Worker is opt-in. It never receives or stores long-lived AWS credentials from the dashboard.
logssey.compliance-worker.enabled=${COMPLIANCE_WORKER_ENABLED:false}
logssey.compliance-worker.api-base-url=${COMPLIANCE_API_BASE_URL:http://localhost:8080}
logssey.compliance-worker.token=${COMPLIANCE_WORKER_TOKEN:}
logssey.compliance-worker.worker-id=${COMPLIANCE_WORKER_ID:compliance-worker-local}
logssey.compliance-worker.poll-delay=${COMPLIANCE_WORKER_POLL_DELAY:10s}
logssey.compliance-worker.heartbeat-delay=${COMPLIANCE_WORKER_HEARTBEAT_DELAY:60s}
logssey.compliance-worker.scan-timeout=${COMPLIANCE_WORKER_SCAN_TIMEOUT:45m}
logssey.compliance-worker.prowler-executable=${PROWLER_EXECUTABLE:prowler}
logssey.compliance-worker.aws-region=${AWS_REGION:ap-northeast-1}
logssey.compliance-worker.sts-endpoint=${AWS_ENDPOINT_URL_STS:}
