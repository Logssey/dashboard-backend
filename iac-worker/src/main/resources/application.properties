spring.application.name=iac-worker
spring.main.web-application-type=none
spring.main.keep-alive=true
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${IAC_DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME}}
spring.datasource.username=${IAC_DB_USERNAME:${DB_USERNAME}}
spring.datasource.password=${IAC_DB_PASSWORD:${DB_PASSWORD}}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-timeout=10000

# Execution is opt-in. Without a processor for a job kind, jobs of that kind stay PENDING.
logssey.iac.executor.enabled=${IAC_JOB_EXECUTOR_ENABLED:false}
logssey.iac.executor.poll-delay=${IAC_JOB_POLL_DELAY:10s}
logssey.iac.executor.lease-duration=${IAC_JOB_LEASE_DURATION:5m}
logssey.iac.executor.batch-size=${IAC_JOB_BATCH_SIZE:10}
logssey.iac.executor.retry-initial-delay=${IAC_JOB_RETRY_INITIAL_DELAY:30s}
logssey.iac.executor.retry-max-delay=${IAC_JOB_RETRY_MAX_DELAY:30m}
# Redacted plans are deleted after analysis; this removes any left past expires_at (1h, SR-5).
logssey.iac.executor.plan-cleanup-delay=${IAC_PLAN_CLEANUP_DELAY:5m}

# Asset graph (Neo4j). Without a URI the ENRICH_GRAPH processor is not created.
logssey.iac.graph.uri=${IAC_GRAPH_URI:}
logssey.iac.graph.username=${IAC_GRAPH_USERNAME:neo4j}
logssey.iac.graph.password=${IAC_GRAPH_PASSWORD:}
# Read-only AWS credentials for CloudFront origins (cloudfront:ListDistributions). Empty = default chain.
logssey.iac.graph.aws-profile=${IAC_AWS_PROFILE:}
# Local only: {"node-name":"InternalIP"} JSON. The in-cluster worker reads the Kubernetes API in S4.
logssey.iac.graph.node-addresses-file=${IAC_NODE_ADDRESSES_FILE:}
